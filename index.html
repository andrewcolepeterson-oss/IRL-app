const POINTS = {perMinute:1, completion:10, perFriend:5, streakMin:3, streakPts:15, friendShare:.8,
  tiers:[{min:60,pts:40,label:'Deep focus bonus'},{min:25,pts:15,label:'Long session bonus'}]};
const DURATIONS = [15,25,45,60];
const TITLES = ['Rookie','Regular','Contender','Challenger','Veteran','Legend'];
const TIERS = [{k:'Bronze',xp:400},{k:'Silver',xp:1000},{k:'Gold',xp:2000},{k:'Legend',xp:3500}];
const TONES = {violet:{bg:'var(--accent)',fg:'var(--on-accent)'},white:{bg:'#F5F5F7',fg:'#0A0A0B'},ink:{bg:'#2A2A31',fg:'#F5F5F7'},lilac:{bg:'#33295F',fg:'#C9BCFF'}};
const EMBLEMS = ['bolt','flame','star','trophy','target','clock','heart','hangout'];
const REACTS = [{k:'fire',icon:'flame'},{k:'bolt',icon:'bolt'},{k:'heart',icon:'heart'}];

/* ============================================================
   2. Helpers
   ============================================================ */
const KEY = 'irl-prototype-v2';
const DAY = 86400000, MIN = 60000;
const pad = n => String(n).padStart(2,'0');
const dayKey = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const dayDiff = (a,b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / DAY);
const weekId = (d = new Date()) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dayKey(x); };
const seasonId = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth()+1);
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase() || '?';
const first = n => n.trim().split(/\s+/)[0] || n;
const fmt = sec => pad(Math.floor(sec/60)) + ':' + pad(Math.floor(sec%60));
const uid = () => 'i' + Math.random().toString(36).slice(2,9);
const genCode = () => 'IRL-' + Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const rnd = (a,b) => a + Math.random() * (b - a);
const num = n => Math.round(n).toLocaleString();
function ago(ts){
  const m = Math.floor((Date.now() - ts) / MIN);
  if(m < 1) return 'Just now';
  if(m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if(h < 24) return h + ' h ago';
  const d = Math.floor(h / 24);
  return d === 1 ? 'Yesterday' : d + ' d ago';
}
function left(ms){
  const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / 3600000), m = Math.floor(ms % 3600000 / MIN);
  return d >= 1 ? d + 'd ' + h + 'h' : h >= 1 ? h + 'h ' + m + 'm' : Math.max(1, m) + 'm';
}
const untilWeek = () => { const d = new Date(); return left(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7 - ((d.getDay() + 6) % 7)) - d); };
const untilDay = () => { const d = new Date(); return left(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1) - d); };
const seasonName = () => MONTHS[new Date().getMonth()] + ' Season';
const seasonDaysLeft = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate(); };

/* levels: level n starts at 60 * (n-1)^2 XP */
const lvlOf = xp => Math.floor(Math.sqrt(Math.max(0, xp) / 60)) + 1;
const lvlStart = l => 60 * (l - 1) * (l - 1);
const titleOf = l => TITLES[Math.min(5, Math.floor((l - 1) / 2))];
function lvlProg(xp){ const l = lvlOf(xp), a = lvlStart(l), b = lvlStart(l + 1); return {l, pct:(xp - a) / (b - a), toNext:b - xp}; }
function tierInfo(xp){
  let cur = -1; TIERS.forEach((t,i) => { if(xp >= t.xp) cur = i; });
  const next = TIERS[cur + 1] || null, prev = cur >= 0 ? TIERS[cur].xp : 0;
  return {cur, name:cur >= 0 ? TIERS[cur].k : 'Unranked', next, pct:next ? (xp - prev) / (next.xp - prev) : 1, toNext:next ? next.xp - xp : 0};
}
function score(mins, friendsIn, streak){
  const lines = [{label:mins + ' min phone-free', pts:mins * POINTS.perMinute},{label:'Completion bonus', pts:POINTS.completion}];
  const tier = POINTS.tiers.find(t => mins >= t.min);
  if(tier) lines.push({label:tier.label, pts:tier.pts});
  if(friendsIn > 0) lines.push({label:friendsIn + (friendsIn === 1 ? ' friend' : ' friends') + ' stayed in', pts:friendsIn * POINTS.perFriend});
  if(streak >= POINTS.streakMin) lines.push({label:streak + ' day streak', pts:POINTS.streakPts});
  return {lines, total:lines.reduce((a,l) => a + l.pts, 0)};
}

function mkPost(s, p){
  const post = {id:uid(), ts:Date.now(), reacts:{}, ...p, pend:p.who === 'me'};

}
function gainXP(s, xp){
  const before = lvlOf(s.me.total);
  const me = {...s.me, total:s.me.total + xp, weekXP:s.me.weekXP + xp, seasonXP:s.me.seasonXP + xp};
  if(me.weekXP > me.pr.weekXP.v) me.pr = {...me.pr, weekXP:{v:me.weekXP, ts:Date.now()}};
  const after = lvlOf(me.total);

}
function checkAch(s){
  const fresh = ACH.filter(a => !s.me.unlocked[a.id] && a.test(s));
  if(!fresh.length) return {s, fresh:[]};
  let st = {...s, me:{...s.me, unlocked:{...s.me.unlocked, ...Object.fromEntries(fresh.map(a => [a.id, Date.now()]))}}};
  if(s.settings.autoShare) fresh.forEach(a => { st = mkPost(st, {who:'me', kind:'ach', title:a.title, sub:'Achievement unlocked', icon:a.icon}); });
  return {s:st, fresh:fresh.map(a => a.id)};
}
function awardQuest(s, q, o = {}){
  const share = o.share !== undefined ? o.share : s.settings.autoShare;
  let st = {...s, claimed:{...s.claimed, [q.key]:Date.now()},
    qhist:[{id:uid(), title:q.title, xp:q.xp, ts:Date.now(), scope:q.scope, group:q.groupId}, ...s.qhist].slice(0, 80)};
  const g = gainXP(st, q.xp); st = g.s;
  if(share) st = mkPost(st, {who:'me', kind:'quest', title:q.title, sub:SCOPE[q.scope] + ' quest complete', xp:q.xp, note:o.note || '', group:q.groupId || undefined});
  if(g.level && share) st = mkPost(st, {who:'me', kind:'level', title:'Level ' + g.level, sub:titleOf(g.level)});
  const a = checkAch(st); st = a.s;
  return {s:st, reward:{title:q.title, xp:q.xp, level:g.level, ach:a.fresh}};
}
function bumpPR(st, key, val, label, broke){
  if(val > st.me.pr[key].v){ broke.push(label); return {...st, me:{...st.me, pr:{...st.me.pr, [key]:{v:val, ts:Date.now()}}}}; }
  return st;
}
function finishSession(s){
  const x = s.session, now = Date.now(), today = dayKey();
  const stay = x.members.filter(m => m.dropAt == null).map(m => m.id);
  const rankBefore = rankOf(s);
  const gap = s.me.lastSessionDay ? dayDiff(s.me.lastSessionDay, today) : 99;
  const streak = gap === 0 ? s.me.streak : gap === 1 ? s.me.streak + 1 : 1;
  const sc = score(x.mins, stay.length, streak);
  const fx = Math.round(sc.total * POINTS.friendShare);
  const week = [...s.me.week]; week[6] += x.mins;
  const hang = {...s.wk.hangouts};
  s.groups.forEach(g => { if(g.members.some(id => stay.includes(id))) hang[g.id] = (hang[g.id] || 0) + 1; });
  let st = {...s,
    me:{...s.me, sessions:s.me.sessions + 1, streak, lastSessionDay:today, week},
    today:{...s.today, sessions:s.today.sessions + 1, mins:s.today.mins + x.mins, maxFriends:Math.max(s.today.maxFriends, stay.length), solo:s.today.solo + (stay.length === 0 ? 1 : 0)},
    wk:{...s.wk, sessions:s.wk.sessions + 1, mins:s.wk.mins + x.mins, solo:s.wk.solo + (stay.length === 0 && x.mins >= 25 ? 1 : 0), longest:Math.max(s.wk.longest, x.mins), hangouts:hang},
    friends:s.friends.map(f => stay.includes(f.id) ? {...f, week:f.week + fx, season:f.season + fx, total:f.total + fx, wmin:f.wmin + x.mins, sessions:f.sessions + 1, lastTs:now} : f)};
  const g = gainXP(st, sc.total); st = g.s;
  const broke = [];
  st = bumpPR(st, 'longest', x.mins, 'Longest session', broke);
  st = bumpPR(st, 'dayMin', st.today.mins, 'Most minutes in a day', broke);
  st = bumpPR(st, 'group', stay.length, 'Biggest hangout', broke);
  st = bumpPR(st, 'streak', streak, 'Longest streak', broke);
  const rankAfter = rankOf(st);
  st = {...st, me:{...st.me, rankDelta:rankBefore - rankAfter}};
  const names = stay.map(id => s.friends.find(f => f.id === id)).filter(Boolean).map(f => first(f.name));
  const withTxt = names.length ? 'with ' + names.join(' and ') : 'on my own';
  const share = s.settings.autoShare;
  if(share) st = mkPost(st, {who:'me', kind:'session', title:x.mins + ' min ' + (names.length ? 'hangout' : 'session'), sub:withTxt, xp:sc.total});
  if(g.level && share) st = mkPost(st, {who:'me', kind:'level', title:'Level ' + g.level, sub:titleOf(g.level)});
  const a = checkAch(st); st = a.s;
  st = {...st, history:[{id:uid(), title:names.length ? 'Hangout with ' + names.join(' and ') : 'Solo session', mins:x.mins, pts:sc.total, ts:now}, ...st.history],
    session:{...x, phase:'done', result:{lines:sc.lines, total:sc.total, mins:x.mins, rankBefore, rankAfter, level:g.level, ach:a.fresh, broke, shared:share, withTxt}}};
  return st;
}

      rivals:s.rivals.map(r => ({...r, week:Math.round(r.week * rnd(.04,.2))}))};

function MiniRing({pct, size = 46, done, children}){

}
function useCountUp(to, dur = 900){
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, t0; const step = t => { if(!t0) t0 = t; const p = Math.min(1, (t - t0) / dur); setV(Math.round(to * (1 - Math.pow(1 - p, 3)))); if(p < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf);
  }, [to]);
  return v;
}
function onColor(hex){
  const h = hex.replace('#', ''), n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 > .62 ? '#0A0A0B' : '#FFFFFF';
}
function applyLook(L){
  const r = document.documentElement; let theme = L.theme;
  if(theme === 'auto'){ try{ theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }catch(e){ theme = 'dark'; } }
  r.dataset.look = theme; r.dataset.density = L.density; r.dataset.type = L.type; r.dataset.corners = L.corners;
  r.dataset.motion = L.motion ? 'on' : 'off'; r.dataset.labels = L.labels ? 'on' : 'off';
  r.style.setProperty('--accent', L.accent); r.style.setProperty('--on-accent', onColor(L.accent)); r.style.colorScheme = theme;
}
function readPhoto(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'), S = 160; c.width = c.height = S;
    const m = Math.min(img.width, img.height); c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
    try{ cb(c.toDataURL('image/jpeg', .82)); }catch(e){}
  }; img.src = r.result; };
  r.readAsDataURL(file);
}

function Navigation({tabs, current, live, go}){
  const [open, setOpen] = useState(false);
  const mobileRef = useRef(null), toggleRef = useRef(null);
  const choose = tab => { setOpen(false); go(tab); };
  useEffect(() => { setOpen(false); }, [current]);
  useEffect(() => {
    if(!open) return;
    const dismiss = e => {
      if(e.type === 'keydown'){
        if(e.key !== 'Escape') return;
        setOpen(false); toggleRef.current?.focus();
      }else if(!mobileRef.current?.contains(e.target)) setOpen(false);
    };
    const desktop = matchMedia('(min-width:768px)');
    const resized = () => { if(desktop.matches) setOpen(false); };
    document.addEventListener('pointerdown', dismiss);
    document.addEventListener('keydown', dismiss);
    desktop.addEventListener('change', resized);
    return () => {
      document.removeEventListener('pointerdown', dismiss);
      document.removeEventListener('keydown', dismiss);
      desktop.removeEventListener('change', resized);
    };
  }, [open]);
  return html`<${React.Fragment}>
    <nav className="tabbar desktop-nav" aria-label="Main" style=${{gridTemplateColumns:tabs.map(t => t.k === 'hangout' ? '1.2fr' : '1fr').join(' ')}}>${tabs.map(t => t.k === 'hangout'

      : html`<button key=${t.k} className="tab" aria-current=${current === t.k ? 'page' : undefined} onClick=${() => go(t.k)}><${Icon} name=${t.icon} size=${23}/><span>${t.label}</span>${t.n > 0 && html`<i>${t.n}</i>`}</button>`)}</nav>
    <nav className="mobile-nav" aria-label="Main" ref=${mobileRef} onBlur=${e => { if(!e.currentTarget.contains(e.relatedTarget)) setOpen(false); }}>
      <button className="mobile-nav-toggle" ref=${toggleRef} aria-expanded=${open} aria-controls="mobile-navigation" onClick=${() => setOpen(v => !v)}><${Icon} name=${open ? 'x' : 'menu'}/><span>Menu</span></button>
      <div className="mobile-nav-links" id="mobile-navigation" hidden=${!open}>
        ${tabs.filter(t => t.k !== 'hangout').map(t => html`<button key=${t.k} aria-current=${current === t.k ? 'page' : undefined} onClick=${() => { choose(t.k); toggleRef.current?.focus(); }}><${Icon} name=${t.icon}/><span>${t.label}</span>${t.n > 0 && html`<span className="pill">${t.n}</span>`}</button>`)}
      </div>
      <button className=${'mobile-nav-play' + (live ? ' live' : '')} aria-current=${current === 'hangout' ? 'page' : undefined} onClick=${() => choose('hangout')}><${Icon} name="phoneoff"/><span>${live ? 'Resume' : 'Play'}</span></button>
    </nav>
  <//>`;
}

/* ============================================================
   11. Hangout (sessions)
   ============================================================ */
function Hangout(){
  const ss = useApp().state.session;
  if(ss && ss.phase === 'lobby') return html`<${Lobby}/>`;
  if(ss && ss.phase === 'active') return html`<${Active}/>`;
  if(ss && ss.phase === 'done') return html`<${Done}/>`;
  return html`<${Idle}/>`;
}
function Idle(){
  const {state, createLobby, joinLobby, pre, setPre, toast} = useApp();
  const friends = state.friends.filter(f => f.status === 'friend');
  const [mode, setMode] = useState('create');
  const [mins, setMins] = useState(25);
  const [sel, setSel] = useState(() => (pre.length ? pre : friends.slice(0,2).map(f => f.id)).filter(id => friends.some(f => f.id === id)));
  const [code, setCode] = useState('');
  useEffect(() => { if(pre.length) setPre([]); }, []);
  const toggle = id => setSel(sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id]);
  const est = score(mins, sel.length, liveStreak(state.me) + 1).total;
  const helps = allQuests(questList(state)).filter(q => q.kind === 'auto' && !q.claimed && !q.sweep).slice(0, 3);
  return html`<div className="screen">
    <${Head} eyebrow="Hangout" title=${html`Phones down. <em>Together.</em>`} sub="Everyone who stays off their phone until the timer ends earns XP."/>
    <${Seg} items=${[{k:'create',label:'Create'},{k:'join',label:'Join with code'}]} value=${mode} onChange=${setMode}/>
    ${mode === 'create' ? html`<div className="stack" style=${{gap:18}}>
        <div><span className="label">How long</span><div className="chips">${DURATIONS.map(d => html`<button key=${d} className="chip" aria-pressed=${mins === d} onClick=${() => setMins(d)}>${d} min</button>`)}</div></div>
        <div><span className="label">Invite friends</span><div className="chips">${friends.map(f => html`<button key=${f.id} className="chip" aria-pressed=${sel.includes(f.id)} onClick=${() => toggle(f.id)}>${first(f.name)}</button>`)}</div></div>
        <div className="card stack" style=${{gap:10}}><div className="between"><span className="muted">XP if everyone stays in</span><span className="xp-num num">~${est}</span></div>
          ${helps.length > 0 && html`<p className="muted" style=${{fontSize:13}}>Moves your quests: ${helps.map(q => q.title).join(', ')}.</p>`}</div>
        <button className="cta violet" onClick=${() => createLobby(mins, sel)}>Open lobby</button>
      </div>` : html`<div className="stack" style=${{gap:14}}>
        <div><label className="label" htmlFor="join-code">Invite code</label><input id="join-code" className="field" placeholder="IRL-7K2Q" maxLength=${8} autoCapitalize="characters" autoComplete="off" value=${code} onChange=${e => setCode(e.target.value.toUpperCase())}/></div>
        <button className="cta violet" disabled=${code.trim().length < 4} onClick=${() => friends.length ? joinLobby(code.trim()) : toast('Add a friend first')}>Join session</button>
        <button className="muted" style=${{fontSize:13}} onClick=${() => setCode('IRL-7K2Q')}>No code handy? Tap to try IRL-7K2Q</button>
      </div>`}
  </div>`;
}
function Lobby(){
  const {state, now, startSession, cancelSession, toast} = useApp();
  const ss = state.session, byId = id => state.friends.find(f => f.id === id), mine = ss.host === 'me';
  const joined = ss.invited.filter(i => i.joinAt <= now);
  const copy = () => { try{ navigator.clipboard.writeText(ss.code).then(() => toast('Code copied'), () => toast('Code: ' + ss.code)); }catch(e){ toast('Code: ' + ss.code); } };
  return html`<div className="screen">
    <${Head} eyebrow=${mine ? 'Your lobby' : 'Joined ' + first(byId(ss.host).name) + '’s hangout'} title=${ss.mins + ' minutes'} right=${null}/>
    <div className="card stack" style=${{alignItems:'center', gap:10}}><span className="eyebrow">Invite code</span><div className="code">${ss.code}</div><button className="btn-sm" onClick=${copy}><${Icon} name="copy" size=${15}/> Copy code</button></div>
    <${Section} title="In the lobby"><div className="card tight">
      <div className="row"><${Avatar} name=${state.me.name} photo=${state.me.photo} me=${true}/><div className="grow"><b>You</b></div><span className="pill">${mine ? 'Host' : 'Ready'}</span></div>
      ${ss.invited.filter(i => byId(i.id)).map(i => { const f = byId(i.id), on = i.joinAt <= now; return html`<div key=${i.id} className="row"><${Avatar} name=${f.name}/><div className="grow"><b>${f.name}</b></div><span className=${on ? 'pill' : 'pill plain'}>${on ? (!mine && i.id === ss.host ? 'Host' : 'Ready') : 'Invited'}</span></div>`; })}
    </div><//>
    ${mine ? html`<div className="stack"><button className="cta violet" onClick=${startSession}>Start${joined.length ? ' with ' + joined.length + (joined.length === 1 ? ' friend' : ' friends') : ''}</button><button className="cta ghost" onClick=${cancelSession}>Cancel</button></div>`
      : html`<div className="stack"><p className="muted" style=${{textAlign:'center'}}>Starting in a moment...</p><button className="cta ghost" onClick=${cancelSession}>Leave</button></div>`}
  </div>`;
}
function Active(){
  const {state, now, endEarly} = useApp();
  const ss = state.session, [confirm, setConfirm] = useState(false);
  const el = elapsedOf(ss, now), total = ss.mins * 60, byId = id => state.friends.find(f => f.id === id);
  return html`<div className="screen">
    <${Head} eyebrow="Phone-free session" title=${html`Stay <em>off.</em>`} right=${null}/>
    <${Ring} pct=${el / total}><span className="timer">${fmt(Math.max(0, total - el))}</span><span className="muted" style=${{fontSize:13}}>of ${ss.mins} min${ss.speed > 1 ? ' (demo speed)' : ''}</span><span className="xp" style=${{marginTop:8}}>+${Math.floor(el / 60) * POINTS.perMinute} XP so far</span><//>
    <${Section} title="Who is still in"><div className="card tight">
      <div className="row"><${Avatar} name=${state.me.name} photo=${state.me.photo} me=${true}/><div className="grow"><b>You</b></div><span className="pill">In</span></div>
      ${ss.members.filter(m => byId(m.id)).map(m => { const f = byId(m.id), out = m.dropAt != null && el >= m.dropAt; return html`<div key=${m.id} className="row" style=${{opacity:out ? .45 : 1}}><${Avatar} name=${f.name}/><div className="grow"><b>${f.name}</b></div><span className=${out ? 'pill plain' : 'pill'}>${out ? 'Picked up' : 'In'}</span></div>`; })}
    </div><//>
    ${confirm ? html`<div className="stack"><p className="muted" style=${{textAlign:'center'}}>Ending now means no XP for this session.</p><button className="btn btn-danger" onClick=${endEarly}>End session</button><button className="cta ghost" onClick=${() => setConfirm(false)}>Keep going</button></div>`
      : html`<button className="cta ghost" onClick=${() => setConfirm(true)}>End early</button>`}
  </div>`;
}
function Done(){
  const {state, commit, go, shareSession} = useApp();
  const r = state.session.result, moved = r.rankBefore - r.rankAfter;
  const n = useCountUp(r.total);
  const ready = readyKeys(state).length;

  return html`<div className="screen">
    <${Head} eyebrow="Session complete" title=${html`${r.mins} minutes. <em>Nice.</em>`} right=${null}/>
    <div className="card hero stack" style=${{alignItems:'center', gap:6}}><span className="eyebrow">XP earned</span><div className="rw-xp num" style=${{fontSize:84}}>+${n}</div>
      <p className="muted" style=${{fontSize:14}}>${moved > 0 ? 'Up ' + moved + (moved === 1 ? ' place' : ' places') + ' to #' + r.rankAfter + ' this week' : 'Holding #' + r.rankAfter + ' this week'}</p></div>
    ${r.level && html`<div className="card hero between" style=${{borderColor:'var(--accent)'}}><div><p className="eyebrow" style=${{color:'var(--accent-hi)'}}>Level up</p><p className="hero-name">${titleOf(r.level)}</p></div><div className="lvl"><small>LV</small><b>${r.level}</b></div></div>`}
    <div className="card tight">${r.lines.map((l,i) => html`<div key=${i} className="row"><span className="grow">${l.label}</span><span className="pts">+${l.pts}</span></div>`)}</div>
    ${r.broke.length > 0 && html`<${Section} title="New personal records"><div className="chips">${r.broke.map(b => html`<span key=${b} className="pill"><${Icon} name="star" size=${14}/>${b}</span>`)}</div><//>`}
    ${r.ach.length > 0 && html`<${Section} title="Unlocked">${r.ach.map(id => { const a = ACH.find(x => x.id === id); return html`<div key=${id} className="pcard"><div className="pi"><${Icon} name=${a.icon} size=${20}/></div><div><b>${a.title}</b><p className="muted" style=${{fontSize:13}}>${a.desc}</p></div></div>`; })}<//>`}
    <div className="stack">
      ${ready > 0 && html`<button className="cta violet" onClick=${() => clear('quests')}>${ready} ${ready === 1 ? 'quest' : 'quests'} ready to claim</button>`}
      ${r.shared ? html`<button className="cta ghost" disabled=${true}>Shared to feed</button>` : html`<button className="cta ghost" onClick=${shareSession}>Share to feed</button>`}
      <button className="cta ghost" onClick=${() => clear(null)}>Go again</button>
      <button className="link" style=${{textAlign:'center', padding:8}} onClick=${() => clear('ranks')}>See the leaderboard</button>

  const fake = [{id:'a',name:'Maya Chen',xp:380,rank:1,isMe:false},{id:'b',name:'You',xp:342,rank:2,isMe:true},{id:'c',name:'Sam Okafor',xp:298,rank:3,isMe:false}];
  const body = [
    html`<div className="onb-body" key="0"><img className="onb-logo" src=${LOGO} alt="IRL"/><div><h1>Your life is the <em>game.</em></h1><p className="sub" style=${{fontSize:17}}>Compete with your friends for everything that happens away from your phone.</p></div></div>`,
    html`<div className="onb-body" key="1"><div className="vis"><${Ring} pct=${.72}><span className="timer" style=${{fontSize:58}}>08:24</span><span className="muted" style=${{fontSize:13}}>of 25 min</span><//><div className="avatars"><${Avatar} name="You" size=${40} me=${true}/><${Avatar} name="Maya Chen" size=${40}/><${Avatar} name="Sam Okafor" size=${40}/></div></div>
      <div><h1>Phones down. <em>Friends up.</em></h1><p className="sub">Start a session together. Everyone who stays off their phone earns XP.</p></div></div>`,
    html`<div className="onb-body" key="2"><div className="card tight" style=${{width:'100%'}}>
        <div className="mini-q"><${MiniRing} pct=${1} done=${true} size=${38}><${Icon} name="check" size=${15}/><//><p className="grow" style=${{fontWeight:600, fontSize:14.5}}>Take a 15 minute walk</p><span className="xp dim">+30</span></div>
        <div className="mini-q"><${MiniRing} pct=${.66} size=${38}><span style=${{fontSize:12}}>2/3</span><//><p className="grow" style=${{fontWeight:600, fontSize:14.5}}>Meet up in person 3 times</p><span className="xp">+150</span></div>
        <div className="mini-q"><${MiniRing} pct=${.3} size=${38}><${Icon} name="phoneoff" size=${14}/><//><p className="grow" style=${{fontWeight:600, fontSize:14.5}}>30 phone-free minutes</p><span className="xp">+50</span></div></div>
      <div><h1>Quests in <em>real life.</em></h1><p className="sub">Daily, weekly and crew quests. Check in, earn XP, level up.</p></div></div>`,
    html`<div className="onb-body" key="3"><div style=${{width:'100%'}}><${Podium} rows=${fake} onPick=${() => {}}/></div>
      <div><h1>Crews. Seasons. <em>Glory.</em></h1><p className="sub">Climb the weekly board, win the monthly season and put your crew on top of the league.</p></div></div>`,
    html`<div className="onb-body" key="4"><div><p className="eyebrow">Last step</p><h1>Pick your <em>name.</em></h1></div>
      <div className="stack"><div><label className="label" htmlFor="ob-name">Display name</label><input id="ob-name" className="field" maxLength=${28} value=${name} onChange=${e => setName(e.target.value)}/></div>
        <div><label className="label" htmlFor="ob-handle">Username</label><input id="ob-handle" className="field" maxLength=${20} autoCapitalize="none" value=${handle} onChange=${e => setHandle(e.target.value.toLowerCase().replace(/[^a-z0-9_.]/g, ''))}/></div></div></div>`
<div>
  <label className="label">Email</label>
  <input
    className="field"
    type="email"
    placeholder="you@example.com"
    value=${email}
    onChange=${e => setEmail(e.target.value)}
  />
</div>
<div>
  <label className="label">Password</label>
  <input
    className="field"
    type="password"
    placeholder="At least 8 characters"
    value=${password}
    onChange=${e => setPassword(e.target.value)}
  />
</div>

  ][step];
  return html`<div className="onb"><div className="onb-in">
    <div className="onb-top"><div className="dots">${[0,1,2,3,4].map(i => html`<i key=${i} className=${i <= step ? 'on' : ''}></i>`)}</div>${step < last && html`<button className="link" onClick=${() => setStep(last)}>Skip</button>`}</div>
    ${body}
    <button className="cta violet" disabled=${step === last && (!name.trim() || !handle.trim())} onClick=${() => step < last ? setStep(step + 1) : signUp()}>${step === 0 ? 'Get started' : step < last ? 'Next' : 'Enter IRL'}</button>
  </div></div>`;
}

/* ============================================================
   16. App shell
   ============================================================ */
function App(){
  const [state, setRaw] = useState(() => { const s = load(); applyLook(s.settings.look); return s; });
  const stRef = useRef(state);
  const commit = useCallback(fn => { const next = normalize(fn(normalize(stRef.current))); stRef.current = next; setRaw(next); return next; }, []);
  const [nav, setNav] = useState({tab:'home', crew:null});
  const [sheet, setSheet] = useState(null);
  const [reward, setReward] = useState(null);
  const [pre, setPre] = useState([]);
  const [now, setNow] = useState(Date.now());
  const [msg, setMsg] = useState(null);
  const msgT = useRef(null), outRef = useRef(0);

  useEffect(() => { applyLook(state.settings.look); if(state.settings.look.theme !== 'auto') return; let mq; try{ mq = matchMedia('(prefers-color-scheme: light)'); }catch(e){ return; } const f = () => applyLook(stRef.current.settings.look); mq.addEventListener('change', f); return () => mq.removeEventListener('change', f); }, [state.settings.look]);
  useEffect(() => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }, [state]);
  const toast = useCallback(m => { setMsg(m); clearTimeout(msgT.current); msgT.current = setTimeout(() => setMsg(null), 2400); }, []);
  const go = tab => { setNav({tab, crew:null, page:null}); setSheet(null); };
  const openCustomize = () => { setNav({tab:'settings', crew:null, page:'customize'}); setSheet(null); };
  const ss = state.session, running = !!ss && (ss.phase === 'lobby' || ss.phase === 'active');

  useEffect(() => { const t = setInterval(() => { setNow(Date.now()); commit(s => s); }, running ? 250 : 30000); return () => clearInterval(t); }, [running]);
  useEffect(() => { window.scrollTo(0, 0); }, [nav.tab, nav.crew]);

  /* sessions */
  const createLobby = (mins, ids) => { const t = Date.now(); commit(s => ({...s, session:{phase:'lobby', code:genCode(), mins, host:'me', createdAt:t, invited:ids.map((id,i) => ({id, joinAt:t + 1300 * (i + 1) + Math.floor(Math.random() * 700)}))}})); setNow(t); };
  const joinLobby = code => { const t = Date.now(); commit(s => { const picks = s.friends.filter(f => f.status === 'friend').sort(() => Math.random() - .5).slice(0, 3);
    return {...s, session:{phase:'lobby', code, mins:[15,25,45][Math.floor(Math.random() * 3)], host:picks[0].id, createdAt:t, autoStartAt:t + 4500, invited:picks.map((f,i) => ({id:f.id, joinAt:t + 900 * i}))}}; }); setNow(t); };
  const startSession = () => { const t = Date.now(); outRef.current = 0;
    commit(s => { const x = s.session; if(!x || x.phase !== 'lobby') return s;
      const members = x.invited.filter(i => i.joinAt <= t).map(i => ({id:i.id, dropAt:Math.random() < .25 ? Math.round(x.mins * 60 * (.25 + Math.random() * .55)) : null}));
      return {...s, session:{...x, phase:'active', startRealTs:t, speed:s.settings.speed, members}}; }); };
  const cancelSession = () => commit(s => ({...s, session:null}));
  const endEarly = () => { commit(s => { const x = s.session; if(!x) return s; const m = Math.floor(elapsedOf(x, Date.now()) / 60);
    return {...s, session:null, history:[{id:uid(), title:'Ended early', mins:m, pts:0, ts:Date.now()}, ...s.history]}; }); toast('Session ended. No XP this time.'); };
  const finish = () => {
    let before = [];
    const next = commit(s => { if(!s.session || s.session.phase !== 'active') return s; before = readyKeys(s); return finishSession(s); });
    if(next.session && next.session.phase === 'done'){ const fresh = readyKeys(next).filter(k => !before.includes(k)); if(fresh.length && next.settings.notif.quests) toast(fresh.length + (fresh.length === 1 ? ' quest' : ' quests') + ' ready to claim'); }
  };
  const shareSession = () => commit(s => { const r = s.session && s.session.result; if(!r || r.shared) return s;
    const st = mkPost(s, {who:'me', kind:'session', title:r.mins + ' min session', sub:r.withTxt, xp:r.total}); return {...st, session:{...st.session, result:{...r, shared:true}}}; });
  useEffect(() => {
    const x = state.session; if(!x) return;
    if(x.phase === 'lobby' && x.autoStartAt && Date.now() >= x.autoStartAt) startSession();
    if(x.phase === 'active'){
      const el = elapsedOf(x, Date.now()), outs = x.members.filter(m => m.dropAt != null && el >= m.dropAt);
      if(outs.length > outRef.current){ outRef.current = outs.length; const f = state.friends.find(y => y.id === outs[outs.length - 1].id); if(f) toast(first(f.name) + ' picked up their phone'); }
      if(el >= x.mins * 60) finish();
    }
  }, [now, state.session]);

  /* quests and feed */
  const claim = q => { let rew = null; commit(s => { if(s.claimed[q.key]) return s; const r = awardQuest(s, q); rew = r.reward; return r.s; }); if(rew) setReward(rew); };
  const checkIn = (q, note, share) => {
    let rew = null, partial = 0;
    commit(s => { const cnt = (s.checks[q.key] || 0) + 1, st = {...s, checks:{...s.checks, [q.key]:cnt}};
      if(cnt >= q.target){ const r = awardQuest(st, q, {note, share}); rew = r.reward; return r.s; } partial = cnt; return st; });
    setSheet(null); if(rew) setReward(rew); else toast('Checked in. ' + partial + ' of ' + q.target);
  };
  const postStatus = (text, group) => commit(s => mkPost(s, {who:'me', kind:'status', text, group}));
  const react = (pid, type) => {
    let fresh = [];
    commit(s => { const p = s.feed.find(x => x.id === pid); const adding = !(p && (p.reacts[type] || []).includes('me'));
      let st = addReact(s, pid, 'me', type); if(adding) st = {...st, me:{...st.me, reacts:st.me.reacts + 1}};
      const a = checkAch(st); fresh = a.fresh; return a.s; });
    if(fresh.length) toast('Achievement unlocked: ' + ACH.find(a => a.id === fresh[0]).title);
  };
  useEffect(() => {
    const pend = state.feed.filter(p => p.who === 'me' && p.pend);
    if(!pend.length) return;
    commit(s => ({...s, feed:s.feed.map(p => p.pend ? {...p, pend:false} : p)}));
    pend.forEach(post => {
      const g = post.group && state.groups.find(x => x.id === post.group);
      let pool = state.friends.filter(f => f.status === 'friend' && (!g || g.members.includes(f.id))).sort(() => Math.random() - .5);
      pool.slice(0, 1 + Math.floor(Math.random() * 3)).forEach((f,i) => setTimeout(() => {
        commit(s => addReact(s, post.id, f.id, REACTS[Math.floor(Math.random() * 3)].k, 'add'));
        if(stRef.current.settings.notif.react) toast(first(f.name) + ' reacted to your post');
      }, 2500 + i * 2400 + Math.random() * 800));
    });
  }, [state.feed]);

  /* friends, nav */
  const addFriend = p => {
    commit(s => ({...s, friends:[...s.friends, {id:p.id, name:p.name, handle:p.handle, week:60 + Math.floor(Math.random() * 200), season:200 + Math.floor(Math.random() * 500), total:300 + Math.floor(Math.random() * 900), wmin:50 + Math.floor(Math.random() * 100), sessions:5 + Math.floor(Math.random() * 20), streak:Math.floor(Math.random() * 5), delta:0, lastTs:Date.now() - 90 * MIN, status:'pending'}]}));
    toast('Invite sent to ' + first(p.name));
    setTimeout(() => commit(s => ({...s, friends:s.friends.map(f => f.id === p.id ? {...f, status:'friend'} : f)})), 1600);
  };
  const inviteFriend = id => { setSheet(null); if(stRef.current.session){ toast('Finish your current session first'); go('hangout'); return; } setPre([id]); go('hangout'); const f = stRef.current.friends.find(x => x.id === id); if(f) toast('Inviting ' + first(f.name)); };
  const resetAll = () => { try{ localStorage.removeItem(KEY); }catch(e){} const s = seed(); stRef.current = s; setRaw(s); setNav({tab:'home', crew:null}); toast('Prototype reset'); };
  const replayIntro = () => commit(s => ({...s, onboarded:false}));
  const finishIntro = (name, handle) => { commit(s => ({...s, onboarded:true, me:{...s.me, name, handle}})); setNav({tab:'home', crew:null}); };

  const ctx = {state, commit, nav, setNav, go, sheet, setSheet, pre, setPre, now, toast, claim, checkIn, postStatus, react, createLobby, joinLobby, startSession, cancelSession, endEarly, shareSession,
    addFriend, inviteFriend, resetAll, replayIntro, openCustomize, openFriend:id => setSheet({type:'friend', id}), openCrew:id => { setNav({tab:'crews', crew:id}); setSheet(null); }, openProfile:() => go('profile')};

  const screens = {home:Home, quests:Quests, hangout:Hangout, ranks:Ranks, crews:Crews, profile:Profile, settings:Settings};
  const Screen = screens[nav.tab] || Home;
  const readyN = readyKeys(state).length, liveSess = state.session && state.session.phase === 'active';
  const el = liveSess ? elapsedOf(state.session, now) : 0;
  const TT = state.settings.tabs, TD = {home:{label:'Home', icon:'home'}, quests:{label:'Quests', icon:'target', n:readyN}, ranks:{label:'Ranks', icon:'trophy'}, crews:{label:'Crews', icon:'hangout'}};
  const side = TT.order.filter(k => k === 'home' || !TT.hidden[k]), half = Math.ceil(side.length / 2);
  const TABS = [...side.slice(0, half), 'hangout', ...side.slice(half)].map(k => k === 'hangout' ? {k, label:'Play'} : {k, ...TD[k]});

  return html`<${Ctx.Provider} value=${ctx}>
    ${!state.onboarded ? html`<${Onboarding} onDone=${finishIntro}/>` : html`<div className="app" key=${nav.tab + (nav.crew || '')}>${nav.crew ? html`<${CrewPage} id=${nav.crew}/>` : html`<${Screen}/>`}</div>`}
    ${state.onboarded && state.session && nav.tab !== 'hangout' && (state.session.phase === 'active' || state.session.phase === 'done') && html`<button className="livebar" onClick=${() => go('hangout')}><span className="dot"></span><div className="grow"><p style=${{fontSize:13}} className="muted">${state.session.phase === 'active' ? 'Session live' : 'Session complete'}</p></div>${state.session.phase === 'active' ? html`<b>${fmt(Math.max(0, state.session.mins * 60 - el))}</b>` : html`<b>Collect XP</b>`}<${Icon} name="chevron" size=${16}/></button>`}
    ${state.onboarded && html`<${Navigation} tabs=${TABS} current=${nav.tab} live=${liveSess} go=${go}/>`}
    ${sheet && sheet.type === 'friend' && html`<${FriendSheet} id=${sheet.id}/>`}
    ${sheet && sheet.type === 'crew' && html`<${CrewSheet} id=${sheet.id}/>`}
    ${sheet && sheet.type === 'checkin' && html`<${CheckinSheet} q=${sheet.q}/>`}
    ${reward && html`<${Reward} r=${reward} onClose=${() => setReward(null)}/>`}
    ${msg && html`<div className="toast" role="status">${msg}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body></html>
